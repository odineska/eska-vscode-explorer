name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eska-explorer-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: github.repository == 'odineska/eska-vscode-explorer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Configure release author
        run: |
          git switch -C main "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Select release work
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py >> "$GITHUB_OUTPUT"
      - name: Select the exact release sources
        if: steps.plan.outputs.build == 'true'
        env:
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          cp scripts/release-vsix.py "$RUNNER_TEMP/release-vsix.py"
          git switch -C main "$RELEASE_COMMIT"
      - name: Install release tools
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          if [[ "$BUILD" == true ]]; then
            bash scripts/install-tools.sh release
          else
            bash scripts/install-tools.sh prepare
          fi
      - name: Fetch published backend release metadata
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-release-metadata.sh
      - name: Validate before publishing
        if: steps.plan.outputs.build == 'true'
        env:
          ESKA_TEST_RELEASE_INPUTS: ${{ runner.temp }}/explorer-release-inputs.json
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run --bun compile
          mkdir -p ../eska-playground
          export ESKA_TEST_ROOT="$(realpath ../eska-playground)"
          node scripts/prepare-backends.mjs
      - name: Verify equivalent full application CI
        id: baseline
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [[ -f scripts/release-ci-proof.py ]]; then
            result="$(timeout --kill-after=2s 25s python3 scripts/release-ci-proof.py "$RUNNER_TEMP/explorer-release-inputs.json" --baseline "$RELEASE_VERSION")" || exit 0
            if [[ "$result" == verified_baseline=true ]]; then
              printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Cache the pinned VS Code archive
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/eska-test-editor/editor.tar.gz
          key: vscode-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-editor.sha256') }}
      - name: Test the client and install the test editor
        if: steps.plan.outputs.build == 'true'
        env:
          VERIFIED_BASELINE: ${{ steps.baseline.outputs.verified_baseline }}
        run: |
          if [[ "$VERIFIED_BASELINE" == true ]]; then
            knope --validate
            bash scripts/test-with-editor.sh --editor-only
          else
            bun run --bun check
            bash scripts/test-with-editor.sh --release
          fi
      - name: Validate the packaged VSIX
        if: steps.plan.outputs.build == 'true'
        run: |
          bun run --bun package:compiled
          vsix="eska-explorer-$(node -p 'require("./package.json").version').vsix"
          python3 scripts/check-vsix.py "$vsix"
          sha256sum "$vsix" > "$RUNNER_TEMP/tested-vsix.sha256"
      - name: Запуск установленного VSIX
        if: steps.plan.outputs.build == 'true'
        env:
          ESKA_HOST_SUPPORT_DISABLED: '1'
        run: |
          export ESKA_TEST_VSIX="$(realpath "eska-explorer-$(node -p 'require("./package.json").version').vsix")"
          timeout 180s xvfb-run -a node test/run-host.mjs test/language-host.cjs
      - name: Publish the prepared version
        id: publish
        if: steps.plan.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.plan.outputs.version }}
          build: ${{ steps.plan.outputs.build }}
        run: |
          if [[ "$build" == true ]]; then
            sha256sum --check "$RUNNER_TEMP/tested-vsix.sha256"
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            # An existing tag must have a published release; API failures are not ignored.
            test "$(gh release view "v$version" --json isDraft --jq .isDraft)" = false
          else
            knope release
            git fetch origin --tags
          fi
          if [[ "$build" == true ]]; then
            python3 "$RUNNER_TEMP/release-vsix.py" "$version" --verified-vsix "eska-explorer-$version.vsix"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Prepare the next release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git switch -C main FETCH_HEAD
          python3 scripts/prepare-release.py

  openvsx:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-stores.yml
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    with:
      version: ${{ needs.release.outputs.version }}
      authentication: token
      dry_run: false
