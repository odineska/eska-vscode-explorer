name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Bun and Knope
        run: bash scripts/install-tools.sh release
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check and compile
        run: |
          bun run --bun check
          bun run --bun compile
      - name: Fetch published backend release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-release-metadata.sh
      - name: Install released backends into a clean prefix
        run: |
          mkdir -p ../eska-playground
          export ESKA_TEST_ROOT="$(realpath ../eska-playground)"
          node scripts/prepare-backends.mjs
      - name: Restore the pinned VS Code archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/eska-test-editor/editor.tar.gz
          key: vscode-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-editor.sha256') }}
      - name: Test the client and install the test editor
        run: bash scripts/test-with-editor.sh
      - name: Check the packaged extension with real Metadata API and LSP
        env:
          ESKA_HOST_SUPPORT_DISABLED: '1'
        run: |
          bun run --bun package:compiled
          export ESKA_TEST_VSIX="$(realpath "eska-explorer-$(node -p 'require("./package.json").version').vsix")"
          python3 scripts/check-vsix.py "$ESKA_TEST_VSIX"
          timeout 180s xvfb-run -a node test/run-host.mjs test/language-host.cjs
